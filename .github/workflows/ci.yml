name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          # The default cache-dependency-glob is "**/uv.lock", and setup-uv
          # ERRORS OUT when no lockfile exists rather than simply missing the
          # cache. This repo pins its dependencies in pyproject.toml instead.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run python -m pytest -q

  smoke:
    # Every project's run.py must actually execute end to end, at a reduced
    # scene count. A repo of results whose generator no longer runs is worse
    # than no results at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Document scanner
        working-directory: projects/01_document_scanner
        run: uv run python run.py --scenes 4
